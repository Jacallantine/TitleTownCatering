<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Reservation</title>
    <link rel="stylesheet" href="../CSS/reserve.css">
    <link rel="stylesheet" href="../CSS/main.css">
</head>
<body>
    <div class = 'navBar' id = "navBar">

        <div class = "navBarOptions">
            <button onclick = "signInHTML()" id = "signIn"   >SIGN IN</button>
            <button onclick = 'homeHTML()' id = "home"     >HOME</button>
            <button onclick = 'contactHTML()' id = 'contact'  >CONTACT</button>
            <button onclick = 'reservationHTML()' id = 'foodMenu' >RESERVATION</button>
            <button onclick = 'adminLoginHTML()' id = 'manager' style="display: none;">MANAGER</button>
            <button onclick = 'menuHTML()'>MENU</button>
        </div>
    </div>



    <!-- BREAKFAST -->
    <div class='menuItem-container' id='breakFast-entree'>
        
        <h1 class='menuItem-categories'>BISCUITS</h1>
        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="PHOTO/MENU/BENC.jpg" alt="biscuit">
                <div class='menuItem-container-row'>
                    <label for="biscuit">BISCUIT</label>
                    <input type="number" id="biscuit">
                    <p>Feeds 24 People</p>
                </div>
            </div>
        </div>
    
        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="./PHOTO/SENC.JPEG" alt="Sausage Egg N Cheese">
                <div class='menuItem-container-row'>
                    <label for="SENC">SAUSAGE EGG N CHEESE</label>
                    <input type="number" id="SENC" placeholder="$20">
                    <p>Feeds 24 People</p>
                </div>
            </div>
        </div>

        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="PHOTO/MENU/ENC.png" alt="EGG N CHEESE">
                <div class='menuItem-container-row'>
                    <label for="ENC">EGG N CHEESE</label>
                    <input type="number" id="ENC">
                </div>
            </div>
        </div>

        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="PHOTO/MENU/ENC.png" alt="Sausage Biscuit">
                <div class='menuItem-container-row'>
                    <label for="ENC">SAUSAGE BISCUIT</label>
                    <input type="number" id="SB">
                    <p>Feeds 24 People</p>
                </div>
            </div>
        </div>
    
    </div>


    <!-- LUNCH -->
    <div class='menuItem-container' id='lunch-entree'>
    
    
        <!-- SAUSAGE EGG N CHEESE -->
        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="./PHOTO/MENU/SENC.jpg" alt="Chicken Sandwich">
                <div class='menuItem-container-row'>
                    <label for="chickenSandwich">CHICKEN SANDWICH</label>
                    <input type="number" id="chickenSandwich">
                    <p>Feeds 24 people</p>
                </div>
            </div>
        </div>

        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="./PHOTO/MENU/SENC.jpg" alt="Chicken Sandwich">
                <div class='menuItem-container-row'>
                    <label for="poBoy">PO BOY</label>
                    <input type="number" id="poBoy">
                    <p>Feeds 24 people</p>
                </div>
            </div>
        </div>

        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="./PHOTO/MENU/SENC.jpg" alt="Cheese Burger">
                <div class='menuItem-container-row'>
                    <label for="cheeseBurger">CHEESE BURGER</label>
                    <input type="number" id="cheeseBurger">
                    <p>Feeds 24 people</p>
                </div>
            </div>
        </div>


        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="./PHOTO/MENU/ENC.png" alt="Hot Dogs">
                <div class='menuItem-container-row'>
                    <label for="hotDog">HOT DOGS</label>
                    <input type="number" id="hotDog">
                </div>
            </div>
        </div>





    </div>

    <!-- DINNER -->
    <div class='menuItem-container' id='dinner-entree'>
        <!-- BACON EGG N CHEESE -->
        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="PHOTO/MENU/BENC.jpg" alt="steak">
                <div class='menuItem-container-row'>
                    <label for="steak">STEAK</label>
                    <input type="number" id="steak">
                </div>
            </div>
        </div>
    
        <!-- SAUSAGE EGG N CHEESE -->
        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="PHOTO/MENU/SENC.jpg" alt="Unsweet tea">
                <div class='menuItem-container-row'>
                    <label for="friedCatfish">FRIED CATFISH</label>
                    <input type="number" id="friedCatfish">
                </div>
            </div>
        </div>

        <div class='menuItem-Background'>
            <div class='boxedBreakfast-wrapper'>
                <img src="PHOTO/MENU/ENC.png" alt="boil">
                <div class='menuItem-container-row'>
                    <label for="boil">LOW COUNTRY BOIL</label>
                    <input type="number" id="boil">
                </div>
            </div>
        </div>



    </div>
   





    <div class="cateringOptions-container">
        <h1 id = 'cateringOptions'>CATERING MENU</h1>
        <div class = 'cateringOptions-button-container'>

        <button onclick= "displayMenuItem('breakFast-entree')" class = 'buttonDeco'id = 'Breakfast'>Breakfast</button>

        <button onclick="displayMenuItem('lunch-entree')" class = 'buttonDeco'id = 'lunch'>Lunch</button>

        <button onclick="displayMenuItem('dinner-entree')"class = 'buttonDeco' id = 'dinner'>Dinner</button>

        <button onclick="displayMenuItem('side-option')"class = 'buttonDeco' id = 'side'>Sides</button>

        <button onclick="displayMenuItem('drink-option')"class = 'buttonDeco' id = 'drink'>Drinks</button>

        <button onclick = "RetrieveInstances()">TEST</button>
    </div>

    <div class = 'cost-container'>

        <h1 id = totalCost>TOTAL PRICE</h1>
        
        

            
            <label for="entrees">ENTREES</label>
            <input type="number" id = 'entrees' readonly>
          

          
                <label for="sides">SIDES</label>
                <input type="number" id = 'sides'readonly>
    
            

           
                <label for="deserts">DESERTS</label>
                <input type="number" id = 'deserts'readonly>
    
           
            
                <label for="beverages">DRINKS</label>
                <input type="number" id = 'beverages'readonly>
           

          
                <label for="total">TOTAL</label>
                <input type="number" id = 'total'readonly>
            

            
                <button onclick = "makePayment()" id = 'payButton'><span>PAY</span></button>
                



    </div>









    <div class = "footer-wrapper">
    <footer>
        <p>&copy; 2024 TitleTownCatering | Delicious meals for all occasions!</p>
    </footer>
    </div>

    
    <script src="../JS/reserve.js"></script>
    <script src="../JS/main.js"></script>
</body>
</html>
