<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="../CSS/createAccount.css">
    <link rel="stylesheet" href="../CSS/main.css">
</head>
<body>
    <div class = 'navBar' id = "navBar">

        <div class = "navBarOptions">
            <button onclick = "signInHTML()" id = "signIn"   >SIGN IN</button>
            <button onclick = 'homeHTML()' id = "home"     >HOME</button>
            <button onclick = 'contactHTML()' id = 'contact'  >CONTACT</button>
            <button onclick = 'menuHTML()'>MENU</button>
        </div>
    </div>



    <div class="createAccount-container">




            <div class = 'top'>

                <label for="fName">First Name</label>
                <input type="text" id="fName">

                <label for="lName">Last Name</label>
                <input type="text" id="lName">

                <label for="email">Email</label>
                <input type="text" id="email">

                <label for="password">Password</label>
                <input type="text" id="password">

                <label for="address">Address</label>
                <input type="text" id="address">

            </div>

            <div class = 'bottom'>

                <label for="state">State</label>
                <input type="text" id="state">

                <label for="zip">Zip Code</label>
                <input type="text" id="zip">

                <button onclick = "createUser()" class = 'send'><span>Create Account</span></button>

            </div>



       
     

        
    
       

        
       

    </div>
